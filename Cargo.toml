[package]
name = "shotpipe"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = "3.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
libc = "0.2.191"
notify = "8.2.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString"] }
tray-icon = "0.26.1"
winit = "0.30.13"
